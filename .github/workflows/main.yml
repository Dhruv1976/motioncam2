name: Build MotionCam Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK / NDK / CMake
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Make scripts executable
        run: |
          chmod +x ./gradlew || true
          chmod +x ./setupenv.sh || true
          find . -name "*.sh" -exec chmod +x {} \;

      - name: Set Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "LLVM_DIR=/usr" >> $GITHUB_ENV

      - name: Show project structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ANDROID ==="
          ls -la MotionCam-Android || true
          echo "=== GRADLE ==="
          find . -name "build.gradle*" -o -name "settings.gradle*" | head -50

      - name: Build native dependencies
        run: |
          ./setupenv.sh

      - name: Build MotionCam
        working-directory: MotionCam-Android
        run: |
          ../gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionCam-Android12-debug
          path: |
            MotionCam-Android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
