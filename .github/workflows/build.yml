name: Build MotionCam Android 12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0"

      - name: Check project structure
        run: |
          echo "=== Repository ==="
          ls -la

          echo "=== MotionCam-Android ==="
          ls -la MotionCam-Android

          echo "=== Gradle files ==="
          find . -maxdepth 4 \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: Setup native dependencies
        run: |
          chmod +x setupenv.sh
          ./setupenv.sh

      - name: Build MotionCam
        working-directory: MotionCam-Android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionCam-Android12-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
